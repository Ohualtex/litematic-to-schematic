name: Publish Release & PyPI Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Matrix (T01-T14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify CLI entry points
        run: |
          lithetic --help
          litematic-to-schematic --help
          litematic2schem --help
          litematic2schematic --help

      - name: Execute unit & integration test suite
        run: |
          python -m unittest discover -s tests -v

  publish:
    name: Create GitHub Release & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel distributions
        run: |
          python -m build

      - name: Create GitHub Release from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
