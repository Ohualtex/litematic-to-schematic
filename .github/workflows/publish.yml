name: Publish Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Matrix (T01-T14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify CLI entry points
        run: |
          lithetic --help
          litematic-to-schematic --help
          litematic2schem --help

      - name: Execute unit & integration test suite
        run: |
          python -m unittest discover -s tests -v

  publish:
    name: Build & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel distributions
        run: |
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

